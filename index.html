<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socks5 转 Clash 订阅转换器与托管服务</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative">
        <h1 class="text-2xl font-bold mb-2 text-blue-400">Socks5 节点转 Clash 在线托管</h1>
        <p class="text-sm text-slate-400 mb-6">支持输入 <code class="text-blue-300 bg-slate-950 px-1.5 py-0.5 rounded">ip:port:user:pass</code> 或 <code class="text-blue-300 bg-slate-950 px-1.5 py-0.5 rounded">socks://</code> 链接，既能一键复制 YAML，也能生成**专属订阅 URL 链接**直接填进 Clash 导入！</p>
        
        <!-- 输入区域 -->
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">1. 输入节点信息</label>
                <textarea id="socksInput" rows="3" placeholder="例如: direct.miyavip.vip:8001:xrqrsdsx:ippmurmoumour 或 socks://..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 font-mono"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">2. 自定义节点名称 <span class="text-slate-500 font-normal">(可选，留空则自动识别)</span></label>
                <input type="text" id="customNameInput" placeholder="例如：美国8.31到期" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="flex gap-3 mb-6">
            <button onclick="generateAndSave()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-all shadow-lg shadow-blue-600/20">
                生成专属订阅 URL 与配置
            </button>
            <button onclick="clearAll()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-lg transition-all text-sm">
                清空
            </button>
        </div>

        <!-- 专属订阅 URL 展示区 -->
        <div class="mb-6 p-4 bg-blue-950/30 border border-blue-900/50 rounded-xl" id="urlBox" style="display:none;">
            <label class="block text-xs font-semibold uppercase tracking-wider text-blue-400 mb-2">🎉 你的 Clash 专属订阅 URL 链接</label>
            <div class="flex gap-2">
                <input type="text" id="subUrlOutput" readonly class="w-full bg-slate-950 border border-blue-800/60 rounded-lg px-3 py-2 text-xs font-mono text-blue-200 focus:outline-none">
                <button onclick="copySubUrl()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-medium transition-all shrink-0">复制 URL</button>
            </div>
            <p class="text-[11px] text-slate-400 mt-2">💡 提示：你可以直接把这个 URL 复制到 Clash 客户端的“URL 导入”中，实现通过链接自动更新配置！</p>
        </div>

        <!-- 输出区域 -->
        <div>
            <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">生成的 YAML 文本预览</label>
                <div class="space-x-3">
                    <button onclick="copyResult()" class="text-xs text-blue-400 hover:underline">复制 YAML</button>
                    <button onclick="downloadYaml()" class="text-xs text-emerald-400 hover:underline">下载 YAML 文件</button>
                </div>
            </div>
            <textarea id="clashOutput" rows="8" readonly class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs focus:outline-none font-mono text-slate-300" placeholder="点击生成后，内容将显示在这里..."></textarea>
        </div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');
            if (dataParam) {
                try {
                    const jsonString = decodeURIComponent(escape(atob(dataParam)));
                    const data = JSON.parse(jsonString);
                    
                    const yaml = buildYaml(data.server, data.port, data.username, data.password, data.nodeName);
                    document.open();
                    document.write('<pre style="background:#0f172a;color:#e2e8f0;padding:20px;font-family:monospace;word-break:break-all;white-space:pre-wrap;">' + escapeHtml(yaml) + '</pre>');
                    document.close();
                    return;
                } catch (e) {
                    console.error("解析订阅数据失败", e);
                }
            }
        };

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function base64Decode(str) {
            try {
                let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) base64 += '=';
                return decodeURIComponent(escape(atob(base64)));
            } catch (e) {
                return null;
            }
        }

        function buildYaml(server, port, username, password, nodeName) {
            let yaml = `port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
geodata-mode: true
geo-auto-update: true
geodata-loader: standard
geo-update-interval: 24

proxies:
  - name: "${nodeName}"
    type: socks5
    server: ${server}
    port: ${port}`;

            if (username) {
                yaml += `\n    username: ${username}`;
            }
            if (password) {
                yaml += `\n    password: ${password}`;
            }

            yaml += `

proxy-groups:
  - type: select
    name: 🚀 节点选择
    proxies:
      - ⚡ 自动选择
      - ${nodeName}
      - DIRECT
      - REJECT
  - name: ⚡ 自动选择
    type: url-test
    proxies:
      - ${nodeName}
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: false
  - type: select
    name: 🐟 漏网之鱼
    proxies:
      - 🚀 节点选择
      - DIRECT
      - REJECT

rules:
  - DOMAIN,ipwho.is,🐟 漏网之鱼
  - MATCH,🐟 漏网之鱼`;

            return yaml;
        }

        function generateAndSave() {
            let input = document.getElementById('socksInput').value.trim();
            const customName = document.getElementById('customNameInput').value.trim();
            const outputArea = document.getElementById('clashOutput');

            if (!input) {
                alert('请输入节点信息');
                return;
            }

            let server = '', port = '', username = '', password = '', nodeName = 'Socks5节点';

            try {
                if (!input.startsWith('socks://') && input.split(':').length >= 4) {
                    const parts = input.split(':');
                    server = parts[0];
                    port = parts[1];
                    username = parts[2];
                    password = parts.slice(3).join(':');
                } else {
                    if (!input.startsWith('socks://')) {
                        input = 'socks://' + input;
                    }
                    const urlObj = new URL(input);
                    server = urlObj.hostname;
                    port = urlObj.port;
                    username = urlObj.username || '';
                    password = urlObj.password || '';

                    if (!username && urlObj.auth) {
                        const authDecoded = base64Decode(urlObj.auth);
                        if (authDecoded && authDecoded.includes(':')) {
                            const parts = authDecoded.split(':');
                            username = parts[0];
                            password = parts.slice(1).join(':');
                        }
                    }
                    if (urlObj.hash) {
                        nodeName = decodeURIComponent(urlObj.hash.substring(1));
                    }
                }

                if (customName) {
                    nodeName = customName;
                }

                const yamlResult = buildYaml(server, port, username, password, nodeName);
                outputArea.value = yamlResult;

                const payload = { server, port, username, password, nodeName };
                const base64Payload = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
                
                const baseUrl = window.location.href.split('?')[0].split('#')[0];
                const subUrl = baseUrl + '?data=' + base64Payload;

                document.getElementById('urlBox').style.display = 'block';
                document.getElementById('subUrlOutput').value = subUrl;

            } catch (err) {
                alert('解析格式失败，请检查输入是否正确: ' + err.message);
            }
        }

        function copyResult() {
            const outputArea = document.getElementById('clashOutput');
            if (!outputArea.value) {
                alert('当前没有可复制的内容');
                return;
            }
            outputArea.select();
            document.execCommand('copy');
            alert('YAML 已成功复制到剪贴板！');
        }

        function copySubUrl() {
            const subUrlInput = document.getElementById('subUrlOutput');
            subUrlInput.select();
            document.execCommand('copy');
            alert('专属订阅 URL 已复制！可以直接填入 Clash 客户端中导入。');
        }

        function downloadYaml() {
            const content = document.getElementById('clashOutput').value;
            if (!content) {
                alert('请先生成 Clash 配置内容');
                return;
            }
            const blob = new Blob([content], { type: 'text/yaml;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'config.yaml';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function clearAll() {
            document.getElementById('socksInput').value = '';
            document.getElementById('customNameInput').value = '';
            document.getElementById('clashOutput').value = '';
            document.getElementById('urlBox').style.display = 'none';
        }
    </script>
</body>
</html>
